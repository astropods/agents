# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: "github-issue-scorer"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    messaging: true

integrations:
  github:
    provider: github

models:
  openai:
    provider: openai

dev:
  interfaces:
    messaging:
      adapters: [web, slack]
      slack:
        socket_mode: true
        auto_thread: true
