name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    name: discover agents
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        name: list agent directories
        shell: bash
        run: |
          set -euo pipefail
          agents=$(./scripts/list-agents.sh | jq -R . | jq -sc .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.agent }})
    needs: discover
    if: needs.discover.outputs.agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install ruff
        run: pip install ruff

      - name: install ast CLI
        run: |
          curl -fsSL https://astropods.com/install | sh
          echo "$HOME/.ast/bin" >> "$GITHUB_PATH"

      - name: check ${{ matrix.agent }}
        run: ./scripts/check-agent.sh "${{ matrix.agent }}"
