# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: zendesk-ticket-triage

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: true

models:
  openai:
    provider: openai

inputs:
  ZENDESK_SUBDOMAIN:
    name: ZENDESK_SUBDOMAIN
    datatype: string
    description: "Zendesk subdomain — the {subdomain} part of https://{subdomain}.zendesk.com"
    display-as: short-text
  ZENDESK_AGENT_EMAIL:
    name: ZENDESK_AGENT_EMAIL
    datatype: string
    description: "Zendesk agent email address used for API authentication"
    display-as: short-text
  ZENDESK_API_KEY:
    name: ZENDESK_API_KEY
    datatype: string
    secret: true
    description: "Zendesk API token"
    display-as: short-text
  PINECONE_HOST:
    name: PINECONE_HOST
    datatype: string
    description: "Full Pinecone index host URL including https:// (e.g. https://my-index-abc123.svc.pinecone.io)"
    display-as: short-text
  PINECONE_API_KEY:
    name: PINECONE_API_KEY
    datatype: string
    secret: true
    description: "Pinecone API key"
    display-as: short-text
  WEBHOOK_SECRET:
    name: WEBHOOK_SECRET
    datatype: string
    secret: true
    description: "Zendesk webhook signing secret — used to verify HMAC-SHA256 signatures on incoming webhook requests"
    display-as: short-text

dev:
  interfaces:
    frontend:
      port: 3000
    messaging:
      adapters: [web, slack]
      slack:
        socket_mode: true
        auto_thread: true
