[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "**/.venv",
  "**/venv",
  "**/dist",
  "**/build",
  "**/__pycache__",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true
preview = true
